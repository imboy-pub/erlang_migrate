# Disposable integration-test databases for erlang_migrate.
# Usage: test/integration/run.sh  (starts both, runs the suite, tears down)
services:
  em-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: em
      POSTGRES_PASSWORD: em
      POSTGRES_DB: em_bootstrap
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U em"]
      interval: 2s
      timeout: 3s
      retries: 30

  em-mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: em
      MYSQL_DATABASE: em_it
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -pem"]
      interval: 2s
      timeout: 3s
      retries: 30
